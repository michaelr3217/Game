<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#000000">
<title>MICHAEL R VIDEO GAME</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
html, body {
  width:100%; height:100%; overflow:hidden; background:#000;
  font-family:'Courier New',monospace;
  touch-action:none; user-select:none; -webkit-user-select:none;
}
canvas { display:block; width:100vw; height:100vh; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
// ── Canvas ──────────────────────────────────────────────────────────────
const canvas = document.getElementById('c');
const ctx    = canvas.getContext('2d');
let W = 0, H = 0;

function resize() {
  const dpr = window.devicePixelRatio || 1;
  W = window.innerWidth;
  H = window.innerHeight;
  canvas.width  = Math.round(W * dpr);
  canvas.height = Math.round(H * dpr);
  canvas.style.width  = W + 'px';
  canvas.style.height = H + 'px';
  ctx.setTransform(1,0,0,1,0,0);
  ctx.scale(dpr, dpr);
}
resize();
window.addEventListener('resize', resize);

// ── Game state ───────────────────────────────────────────────────────────
let score=0, hi=10000, lives=3, level=1;
let gameState = 'title'; // 'title' | 'playing' | 'dead' | 'over'
let player, bullets=[], enemies=[], eBullets=[], stars=[], particles=[], bonus=null;
let bonusTexts=[];
let enemyDir=1, enemyMoveTimer=0;
let lastShot=0, lastEShot=0;
let bonusTimer=0, waveCleared=false, waveTimer=0;
let frameCount=0;

// ── Keyboard ─────────────────────────────────────────────────────────────
const keys = {};
document.addEventListener('keydown', e => {
  keys[e.key]=true;
  if (e.key===' ') e.preventDefault();
  if ((e.key==='Enter'||e.key===' ') && (gameState==='title'||gameState==='over')) startGame();
});
document.addEventListener('keyup', e => { keys[e.key]=false; });
canvas.addEventListener('click', () => { if (gameState==='title'||gameState==='over') startGame(); });

// ── Touch ─────────────────────────────────────────────────────────────────
// All touch events go on the canvas itself. Left 50% = move, right 50% = fire.
const activeTouches = {};
let moveActive=false, moveStartX=0, moveCurX=0, fireActive=false;

function rebuildState() {
  moveActive=false; fireActive=false;
  for (const id in activeTouches) {
    const t = activeTouches[id];
    if (t.side==='move') { moveActive=true; moveStartX=t.sx; moveCurX=t.cx; }
    if (t.side==='fire') fireActive=true;
  }
}

canvas.addEventListener('touchstart', e => {
  e.preventDefault();
  unlockAudio();
  if (gameState==='title'||gameState==='over') { startGame(); return; }
  for (const t of e.changedTouches) {
    activeTouches[t.identifier] = {
      side: t.clientX < W*0.5 ? 'move' : 'fire',
      sx: t.clientX, cx: t.clientX
    };
  }
  rebuildState();
}, { passive:false });

canvas.addEventListener('touchmove', e => {
  e.preventDefault();
  for (const t of e.changedTouches) {
    if (activeTouches[t.identifier]) activeTouches[t.identifier].cx = t.clientX;
  }
  rebuildState();
}, { passive:false });

canvas.addEventListener('touchend', e => {
  e.preventDefault();
  for (const t of e.changedTouches) delete activeTouches[t.identifier];
  rebuildState();
}, { passive:false });

canvas.addEventListener('touchcancel', e => {
  for (const t of e.changedTouches) delete activeTouches[t.identifier];
  rebuildState();
}, { passive:false });

document.addEventListener('contextmenu', e => e.preventDefault());

// ── Audio — period-correct arcade synthesis ───────────────────────────────
// Modelled on Galaxian (1979) / Space Invaders (1978) hardware sound:
// AY-3-8910 PSG chip tones + noise channel via Web Audio API.
let AC = null; // AudioContext, created on first user gesture

function getAC() {
  if (!AC) {
    try { AC = new (window.AudioContext || window.webkitAudioContext)(); } catch(e) { return null; }
  }
  if (AC.state === 'suspended') AC.resume();
  return AC;
}

// Unlock on ANY user interaction — called before startGame and on every touch
function unlockAudio() { getAC(); }

// Master volume
function masterGain(ac) {
  const g = ac.createGain();
  g.gain.value = 0.55;
  g.connect(ac.destination);
  return g;
}

// Noise source — emulates the AY chip noise channel (filtered white noise)
function makeNoise(ac, durationSec) {
  const bufLen = Math.ceil(ac.sampleRate * durationSec);
  const buf = ac.createBuffer(1, bufLen, ac.sampleRate);
  const d = buf.getChannelData(0);
  // LFSR-style noise (sounds more like vintage chips than pure white noise)
  let s = 0xACE1;
  for (let i = 0; i < bufLen; i++) {
    s ^= s << 13; s ^= s >> 17; s ^= s << 5;
    d[i] = (s & 1) ? 1 : -1;
  }
  const src = ac.createBufferSource();
  src.buffer = buf;
  return src;
}

function playSound(type) {
  const ac = getAC();
  if (!ac) return;
  const now = ac.currentTime;
  const out = masterGain(ac);

  try {
    // ── SHOOT — Galaxian laser: short descending square-wave blip ──────────
    if (type === 'shoot') {
      const osc = ac.createOscillator();
      const env = ac.createGain();
      osc.type = 'square';
      // Two-tone chip laser: high chirp drops fast
      osc.frequency.setValueAtTime(1400, now);
      osc.frequency.exponentialRampToValueAtTime(320, now + 0.055);
      env.gain.setValueAtTime(0.28, now);
      env.gain.exponentialRampToValueAtTime(0.001, now + 0.07);
      osc.connect(env); env.connect(out);
      osc.start(now); osc.stop(now + 0.08);
    }

    // ── EXPLODE — enemy explosion: noise burst + pitched rumble ───────────
    if (type === 'explode') {
      // Noise burst (AY noise channel)
      const noise = makeNoise(ac, 0.35);
      const nFilt = ac.createBiquadFilter();
      nFilt.type = 'bandpass';
      nFilt.frequency.setValueAtTime(800, now);
      nFilt.frequency.exponentialRampToValueAtTime(80, now + 0.3);
      nFilt.Q.value = 0.8;
      const nEnv = ac.createGain();
      nEnv.gain.setValueAtTime(0.5, now);
      nEnv.gain.exponentialRampToValueAtTime(0.001, now + 0.32);
      noise.connect(nFilt); nFilt.connect(nEnv); nEnv.connect(out);
      noise.start(now); noise.stop(now + 0.35);

      // Low pitched tone underneath (Galaxian explosion thud)
      const osc = ac.createOscillator();
      osc.type = 'sawtooth';
      const oEnv = ac.createGain();
      osc.frequency.setValueAtTime(160, now);
      osc.frequency.exponentialRampToValueAtTime(30, now + 0.28);
      oEnv.gain.setValueAtTime(0.35, now);
      oEnv.gain.exponentialRampToValueAtTime(0.001, now + 0.3);
      osc.connect(oEnv); oEnv.connect(out);
      osc.start(now); osc.stop(now + 0.3);
    }

    // ── DIE — player death: long descending noise + low moan ──────────────
    if (type === 'die') {
      // Long noise sweep downward
      const noise = makeNoise(ac, 0.8);
      const nFilt = ac.createBiquadFilter();
      nFilt.type = 'lowpass';
      nFilt.frequency.setValueAtTime(3000, now);
      nFilt.frequency.exponentialRampToValueAtTime(60, now + 0.75);
      const nEnv = ac.createGain();
      nEnv.gain.setValueAtTime(0.6, now);
      nEnv.gain.exponentialRampToValueAtTime(0.001, now + 0.78);
      noise.connect(nFilt); nFilt.connect(nEnv); nEnv.connect(out);
      noise.start(now); noise.stop(now + 0.8);

      // Descending oscillator sweep (classic "player dies" tone)
      const osc = ac.createOscillator();
      osc.type = 'square';
      const oEnv = ac.createGain();
      osc.frequency.setValueAtTime(440, now);
      osc.frequency.exponentialRampToValueAtTime(28, now + 0.9);
      oEnv.gain.setValueAtTime(0.3, now);
      oEnv.gain.exponentialRampToValueAtTime(0.001, now + 0.9);
      osc.connect(oEnv); oEnv.connect(out);
      osc.start(now); osc.stop(now + 0.92);
    }

    // ── BONUS — UFO saucer hit: ascending arpeggio (Galaxian bonus sound) ─
    if (type === 'bonus') {
      // Three quick ascending tones, AY-style triangle wave
      const freqs = [523, 784, 1047, 1568]; // C5 G5 C6 G6
      freqs.forEach((f, i) => {
        const osc = ac.createOscillator();
        const env = ac.createGain();
        osc.type = 'triangle';
        const t0 = now + i * 0.07;
        osc.frequency.setValueAtTime(f, t0);
        env.gain.setValueAtTime(0.3, t0);
        env.gain.exponentialRampToValueAtTime(0.001, t0 + 0.1);
        osc.connect(env); env.connect(out);
        osc.start(t0); osc.stop(t0 + 0.12);
      });
    }

    // ── MARCH — the iconic 4-note Galaxian enemy march beat ───────────────
    // Called from the game loop on a timer (not on events)
    if (type === 'march1') { _marchTone(ac, out, now, 160); }
    if (type === 'march2') { _marchTone(ac, out, now, 120); }
    if (type === 'march3') { _marchTone(ac, out, now, 100); }
    if (type === 'march4') { _marchTone(ac, out, now,  80); }

    // ── DIVE — enemy dive screech: rising noise chirp ─────────────────────
    if (type === 'dive') {
      const osc = ac.createOscillator();
      osc.type = 'sawtooth';
      const env = ac.createGain();
      osc.frequency.setValueAtTime(200, now);
      osc.frequency.exponentialRampToValueAtTime(900, now + 0.18);
      osc.frequency.exponentialRampToValueAtTime(200, now + 0.36);
      env.gain.setValueAtTime(0.18, now);
      env.gain.exponentialRampToValueAtTime(0.001, now + 0.38);
      osc.connect(env); env.connect(out);
      osc.start(now); osc.stop(now + 0.4);
    }

    // ── LEVEL UP — wave cleared fanfare ───────────────────────────────────
    if (type === 'levelup') {
      const melody = [523,659,784,1047]; // C E G C
      melody.forEach((f, i) => {
        const osc = ac.createOscillator();
        const env = ac.createGain();
        osc.type = 'square';
        const t0 = now + i * 0.11;
        osc.frequency.setValueAtTime(f, t0);
        env.gain.setValueAtTime(0.25, t0);
        env.gain.exponentialRampToValueAtTime(0.001, t0 + 0.13);
        osc.connect(env); env.connect(out);
        osc.start(t0); osc.stop(t0 + 0.15);
      });
    }

  } catch(e) { /* silent fail */ }
}

function _marchTone(ac, out, now, freq) {
  const osc = ac.createOscillator();
  const env = ac.createGain();
  osc.type = 'square';
  osc.frequency.setValueAtTime(freq, now);
  env.gain.setValueAtTime(0.18, now);
  env.gain.exponentialRampToValueAtTime(0.001, now + 0.06);
  osc.connect(env); env.connect(out);
  osc.start(now); osc.stop(now + 0.08);
}

// ── Enemy march beat timer ─────────────────────────────────────────────────
let marchStep = 0, lastMarch = 0;
const MARCH_SOUNDS = ['march1','march2','march3','march4'];
function tickMarch() {
  if (gameState !== 'playing') return;
  const alive = enemies.filter(e=>e.alive).length;
  // Speed up march as enemies decrease (matches original game behaviour)
  const interval = Math.max(120, 600 - (40 - alive) * 12 - level * 20);
  const now = Date.now();
  if (now - lastMarch > interval) {
    playSound(MARCH_SOUNDS[marchStep % 4]);
    marchStep++;
    lastMarch = now;
  }
}

// ── Game init ────────────────────────────────────────────────────────────
function startGame() {
  score=0; lives=3; level=1;
  bullets=[]; eBullets=[]; particles=[]; bonusTexts=[]; bonus=null;
  bonusTimer=0; waveCleared=false; waveTimer=0; frameCount=0;
  player = { x:W/2, y:H-80, speed:4 };
  initStars(); initEnemies();
  gameState='playing';
}

function initStars() {
  stars=[];
  for (let i=0;i<100;i++) stars.push({x:Math.random()*W,y:Math.random()*H,s:.4+Math.random()*1.2,r:.5+Math.random()*1.5});
}

function initEnemies() {
  enemies=[]; enemyDir=1; enemyMoveTimer=0; marchStep=0; lastMarch=0;
  const cols = Math.min(10, Math.floor((W-60)/46));
  const spacingX = Math.min(50, (W-60)/cols);
  const startX = (W - spacingX*(cols-1)) / 2;
  const types=['bee','butterfly','galaxian','boss'];
  const colors=['#0ff','#ff0','#f0f','#f44'];
  const pts=[10,20,30,50];
  for (let r=0;r<4;r++) for (let c=0;c<cols;c++) {
    const bx=startX+c*spacingX, by=60+r*42;
    enemies.push({x:bx,y:by,bx,by,alive:true,type:types[r],color:colors[r],pts:pts[r],dive:'formation',diveTarget:null,frame:0,ft:0});
  }
}

// ── Main loop ────────────────────────────────────────────────────────────
function loop() {
  requestAnimationFrame(loop);
  frameCount++;
  ctx.fillStyle='#000';
  ctx.fillRect(0,0,W,H);
  updateStars(); drawStars();

  if (gameState==='title') { drawTitle(); return; }
  if (gameState==='over')  { drawGameOver(); return; }

  updatePlayer(); updateBullets(); updateEnemies();
  updateEBullets(); updateBonus(); updateParticles(); checkCollisions();
  drawEnemies(); drawEBullets(); drawBonus();
  drawBullets(); drawPlayer(); drawParticles();
  drawHUD(); drawTouchHints();
  tickMarch();

  if (waveCleared) { waveTimer++; if(waveTimer>90){level++;initEnemies();waveCleared=false;waveTimer=0;playSound('levelup');} }
}

// ── Stars ────────────────────────────────────────────────────────────────
function updateStars() { for(const s of stars){s.x-=s.s;if(s.x<0){s.x=W;s.y=Math.random()*H;}} }
function drawStars()   { for(const s of stars){ctx.fillStyle=`rgba(255,255,255,${.15+s.r*.2})`;ctx.fillRect(s.x|0,s.y|0,s.r,s.r);} }

// ── Player ───────────────────────────────────────────────────────────────
function updatePlayer() {
  if (!player) return;
  let goL=keys['ArrowLeft']||keys['a'], goR=keys['ArrowRight']||keys['d'], shoot=keys[' ']||keys['z'];
  if (moveActive) {
    const dx=moveCurX-moveStartX;
    if (dx < -10) goL=true;
    if (dx >  10) goR=true;
  }
  if (fireActive) shoot=true;
  const spd=player.speed*(1+level*.05);
  if (goL) player.x=Math.max(20,      player.x-spd);
  if (goR) player.x=Math.min(W-20,    player.x+spd);
  if (shoot && Date.now()-lastShot>220) {
    bullets.push({x:player.x,y:player.y-14,speed:10,alive:true});
    lastShot=Date.now(); playSound('shoot');
  }
}

function drawPlayer() {
  if (!player) return;
  const x=player.x|0, y=player.y|0;
  ctx.save(); ctx.shadowColor='#0ff'; ctx.shadowBlur=10; ctx.fillStyle='#0ff';
  ctx.beginPath(); ctx.moveTo(x,y-14); ctx.lineTo(x-13,y+8); ctx.lineTo(x-5,y+4);
  ctx.lineTo(x,y+8); ctx.lineTo(x+5,y+4); ctx.lineTo(x+13,y+8); ctx.closePath(); ctx.fill();
  ctx.fillStyle='#fff'; ctx.fillRect(x-2,y-4,4,6); ctx.restore();
}

// ── Bullets ──────────────────────────────────────────────────────────────
function updateBullets() {
  for(const b of bullets) b.y-=b.speed;
  bullets=bullets.filter(b=>b.y>-20&&b.alive!==false);
}
function drawBullets() {
  ctx.save(); ctx.shadowColor='#0ff'; ctx.shadowBlur=8; ctx.fillStyle='#0ff';
  for(const b of bullets) ctx.fillRect((b.x|0)-1,(b.y|0),3,14);
  ctx.restore();
}

// ── Enemies ──────────────────────────────────────────────────────────────
function updateEnemies() {
  const alive=enemies.filter(e=>e.alive);
  if (!alive.length&&!waveCleared){waveCleared=true;waveTimer=0;return;}
  const interval=Math.max(10,28-level*2-(enemies.length-alive.length)*.4);
  if (++enemyMoveTimer>=interval) {
    enemyMoveTimer=0;
    let minX=Infinity,maxX=-Infinity;
    for(const e of alive) if(e.dive==='formation'){minX=Math.min(minX,e.bx);maxX=Math.max(maxX,e.bx);}
    if(maxX+enemyDir*18>W-28||minX+enemyDir*18<28){
      enemyDir*=-1; for(const e of alive) if(e.dive==='formation') e.by+=10;
    } else { for(const e of alive) if(e.dive==='formation') e.bx+=enemyDir*18; }
  }
  for(const e of enemies){
    if(!e.alive)continue;
    if(++e.ft>16){e.frame=1-e.frame;e.ft=0;}
    if(e.dive==='formation'){
      e.x+=(e.bx-e.x)*.15; e.y+=(e.by-e.y)*.15;
      if(alive.length>4&&Math.random()<.0003*level){
        e.dive='diving'; e.diveTarget={x:player?player.x+(Math.random()-.5)*80:W/2,y:H+60};
        playSound('dive');
      }
    } else {
      const dx=e.diveTarget.x-e.x,dy=e.diveTarget.y-e.y;
      const d=Math.sqrt(dx*dx+dy*dy)||1,spd=2.5+level*.4;
      e.x+=dx/d*spd; e.y+=dy/d*spd;
      if(e.y>H+50){e.dive='formation';e.x=e.bx;e.y=e.by;}
    }
    if(Date.now()-lastEShot>1100-level*70&&Math.random()<.005){
      eBullets.push({x:e.x,y:e.y+12,speed:3+level*.35,color:e.color});
      lastEShot=Date.now();
    }
  }
}

function drawEnemies() {
  for(const e of enemies){
    if(!e.alive)continue;
    ctx.save(); ctx.shadowColor=e.color; ctx.shadowBlur=8; ctx.fillStyle=e.color;
    const x=e.x|0,y=e.y|0,f=e.frame;
    if(e.type==='bee'){
      ctx.fillRect(x-6,y-8,12,16); ctx.fillStyle='#fff';
      ctx.fillRect(x-10,y+(f?-2:0),5,8); ctx.fillRect(x+5,y+(f?-2:0),5,8);
      ctx.fillStyle='#000'; ctx.fillRect(x-3,y-5,3,3); ctx.fillRect(x+1,y-5,3,3);
    } else if(e.type==='butterfly'){
      ctx.beginPath(); ctx.ellipse(x,y,8,10,0,0,Math.PI*2); ctx.fill();
      ctx.fillStyle='rgba(255,255,255,.6)';
      ctx.beginPath(); ctx.ellipse(x-(f?12:10),y-2,f?7:9,6,0,0,Math.PI*2); ctx.fill();
      ctx.beginPath(); ctx.ellipse(x+(f?12:10),y-2,f?7:9,6,0,0,Math.PI*2); ctx.fill();
    } else if(e.type==='galaxian'){
      ctx.beginPath(); ctx.moveTo(x,y-10); ctx.lineTo(x-10,y+10); ctx.lineTo(x+10,y+10); ctx.closePath(); ctx.fill();
      ctx.fillStyle='rgba(255,255,255,.5)';
      ctx.beginPath(); ctx.moveTo(x,y-4); ctx.lineTo(x-5,y+6); ctx.lineTo(x+5,y+6); ctx.closePath(); ctx.fill();
      ctx.fillRect(x-(f?14:12),y,f?5:8,4); ctx.fillRect(x+(f?9:4),y,f?5:8,4);
    } else {
      ctx.beginPath(); ctx.arc(x,y,10,0,Math.PI*2); ctx.fill();
      ctx.fillStyle='rgba(0,0,0,.5)'; ctx.beginPath(); ctx.arc(x-3,y-3,3,0,Math.PI*2); ctx.fill();
      ctx.beginPath(); ctx.arc(x+3,y-3,3,0,Math.PI*2); ctx.fill();
      ctx.fillStyle='rgba(255,255,255,.7)'; ctx.fillRect(x-8,y+(f?3:5),4,3); ctx.fillRect(x+4,y+(f?3:5),4,3);
    }
    ctx.restore();
  }
}

// ── Enemy bullets ─────────────────────────────────────────────────────────
function updateEBullets(){for(const b of eBullets)b.y+=b.speed;eBullets=eBullets.filter(b=>b.y<H+10);}
function drawEBullets(){for(const b of eBullets){ctx.save();ctx.shadowColor=b.color;ctx.shadowBlur=5;ctx.fillStyle=b.color;ctx.fillRect((b.x|0)-1,(b.y|0),3,10);ctx.restore();}}

// ── Bonus ship ────────────────────────────────────────────────────────────
function updateBonus(){
  if(++bonusTimer>400&&!bonus&&Math.random()<.003){bonus={x:-30,y:40,speed:2+level*.3,pts:Math.random()<.5?300:500};bonusTimer=0;}
  if(bonus){bonus.x+=bonus.speed;if(bonus.x>W+40)bonus=null;}
}
function drawBonus(){
  if(!bonus)return;
  ctx.save();ctx.shadowColor='#f0f';ctx.shadowBlur=12;ctx.fillStyle='#f0f';
  ctx.beginPath();ctx.ellipse(bonus.x|0,bonus.y,18,8,0,0,Math.PI*2);ctx.fill();
  ctx.fillStyle='rgba(255,255,255,.7)';ctx.beginPath();ctx.ellipse(bonus.x|0,bonus.y-4,8,4,0,0,Math.PI*2);ctx.fill();
  ctx.restore();
}

// ── Particles ─────────────────────────────────────────────────────────────
function spawnParticles(x,y,color,n){for(let i=0;i<n;i++){const a=Math.random()*Math.PI*2,s=1+Math.random()*3;particles.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,life:50,max:50,color,size:2+Math.random()*2});}}
function updateParticles(){
  for(const p of particles){p.x+=p.vx;p.y+=p.vy;p.vy+=.06;p.life--;}
  particles=particles.filter(p=>p.life>0);
  for(const b of bonusTexts){b.y-=.8;b.timer--;}
  bonusTexts=bonusTexts.filter(b=>b.timer>0);
}
function drawParticles(){
  for(const p of particles){ctx.save();ctx.globalAlpha=p.life/p.max;ctx.fillStyle=p.color;ctx.fillRect(p.x|0,p.y|0,p.size,p.size);ctx.restore();}
  for(const b of bonusTexts){ctx.save();ctx.globalAlpha=b.timer/60;ctx.fillStyle='#ff0';ctx.font='bold 16px Courier New';ctx.textAlign='center';ctx.fillText('+'+b.pts,b.x|0,b.y|0);ctx.restore();}
}

// ── Collisions ────────────────────────────────────────────────────────────
function checkCollisions(){
  for(const b of bullets){
    if(b.alive===false)continue;
    for(const e of enemies){
      if(!e.alive)continue;
      if(Math.abs(b.x-e.x)<14&&Math.abs(b.y-e.y)<14){
        e.alive=false;b.alive=false;
        score+=e.pts*(e.dive==='diving'?2:1);
        spawnParticles(e.x,e.y,e.color,8);playSound('explode');
        if(score>hi)hi=score;
      }
    }
    if(bonus&&Math.abs(b.x-bonus.x)<20&&Math.abs(b.y-bonus.y)<12){
      score+=bonus.pts;b.alive=false;
      spawnParticles(bonus.x,bonus.y,'#f0f',12);
      bonusTexts.push({x:bonus.x,y:bonus.y,pts:bonus.pts,timer:60});
      playSound('bonus');bonus=null;if(score>hi)hi=score;
    }
  }
  bullets=bullets.filter(b=>b.alive!==false);
  if(player){
    for(const b of eBullets){if(Math.abs(b.x-player.x)<12&&Math.abs(b.y-player.y)<14){b.y=9999;hitPlayer();}}
    for(const e of enemies){if(!e.alive)continue;if(Math.abs(e.x-player.x)<18&&Math.abs(e.y-player.y)<18){e.alive=false;hitPlayer();}}
  }
}

function hitPlayer(){
  if(!player)return;
  spawnParticles(player.x,player.y,'#0ff',16);playSound('die');lives--;
  player=null; gameState='dead';
  if(lives<=0){setTimeout(()=>{gameState='over';},900);}
  else{setTimeout(()=>{player={x:W/2,y:H-80,speed:4};gameState='playing';},1400);}
}

// ── HUD ───────────────────────────────────────────────────────────────────
function drawHUD(){
  ctx.save(); ctx.font='bold 13px Courier New';
  ctx.fillStyle='#555'; ctx.textAlign='left';  ctx.fillText('SCORE',16,22);
  ctx.fillStyle='#0ff';                         ctx.fillText(score,16,38);
  ctx.fillStyle='#555'; ctx.textAlign='center'; ctx.fillText('LIVES',W/2,22);
  ctx.fillStyle='#0ff';
  for(let i=0;i<lives;i++) ctx.fillText('▲',W/2-(lives-1)*10+i*20,38);
  ctx.fillStyle='#555'; ctx.textAlign='right';  ctx.fillText('HI',W-16,22);
  ctx.fillStyle='#0ff';                          ctx.fillText(hi,W-16,38);
  ctx.fillStyle='rgba(255,255,0,.5)'; ctx.textAlign='center'; ctx.font='11px Courier New';
  ctx.fillText('LEVEL '+level,W/2,H-8);
  ctx.restore();
}

// ── Touch hints drawn on canvas ───────────────────────────────────────────
function drawTouchHints(){
  if(!('ontouchstart' in window)) return;
  ctx.save();

  // Move zone (left)
  const lx=W*.25, ly=H-60;
  ctx.globalAlpha=.2; ctx.strokeStyle='#0ff'; ctx.lineWidth=2;
  ctx.beginPath(); ctx.arc(lx,ly,44,0,Math.PI*2); ctx.stroke();
  // nub follows drag
  let jdx=0;
  if(moveActive) jdx=Math.max(-28,Math.min(28,moveCurX-moveStartX));
  ctx.globalAlpha=moveActive?.4:.15; ctx.fillStyle='#0ff';
  ctx.beginPath(); ctx.arc(lx+jdx,ly,18,0,Math.PI*2); ctx.fill();
  ctx.globalAlpha=.25; ctx.fillStyle='#fff'; ctx.font='14px sans-serif'; ctx.textAlign='center';
  ctx.fillText('◀ ▶',lx,ly+5);

  // Fire zone (right)
  const rx=W*.75, ry=H-60;
  ctx.globalAlpha=fireActive?.5:.2;
  ctx.strokeStyle=fireActive?'#fa0':'#f80'; ctx.fillStyle=fireActive?'rgba(255,140,0,.3)':'rgba(255,80,0,.07)';
  ctx.beginPath(); ctx.arc(rx,ry,44,0,Math.PI*2); ctx.fill(); ctx.stroke();
  ctx.globalAlpha=fireActive?.9:.3; ctx.font='28px sans-serif'; ctx.textAlign='center';
  ctx.fillText('🔥',rx,ry+10);

  ctx.restore();
}

// ── Screens ───────────────────────────────────────────────────────────────
function drawTitle(){
  ctx.save(); ctx.textAlign='center';
  const cy=H/2;
  ctx.shadowColor='#0ff'; ctx.shadowBlur=28; ctx.fillStyle='#0ff';
  ctx.font=`bold ${Math.min(60,W*.13)}px Courier New`;
  ctx.fillText('MICHAEL R',W/2,cy-80);
  ctx.font=`bold ${Math.min(28,W*.06)}px Courier New`;
  ctx.fillStyle='rgba(0,255,255,0.6)';
  ctx.fillText('VIDEO GAME',W/2,cy-38);
  ctx.shadowBlur=0;
  ctx.fillStyle='#ff0'; ctx.font=`${Math.min(12,W*.028)}px Courier New`;
  ctx.fillText('★  SPACE INVADERS REIMAGINED  ★',W/2,cy-4);
  ctx.fillStyle='#777'; ctx.font=`${Math.min(13,W*.03)}px Courier New`;
  const hasTouch='ontouchstart' in window;
  if(hasTouch){
    ctx.fillText('LEFT SIDE — DRAG TO MOVE',W/2,cy+28);
    ctx.fillText('RIGHT SIDE — TAP TO FIRE',W/2,cy+50);
  } else {
    ctx.fillText('← →  MOVE        SPACE  FIRE',W/2,cy+36);
  }
  ctx.fillText('Shoot all enemies to advance',W/2,cy+76);
  ctx.fillText('Catch the bonus saucer!',W/2,cy+96);
  if(Math.floor(Date.now()/600)%2===0){
    ctx.fillStyle='#0f0'; ctx.font=`bold ${Math.min(15,W*.034)}px Courier New`;
    ctx.fillText(hasTouch?'TAP TO START':'CLICK / PRESS ENTER',W/2,cy+136);
  }
  ctx.restore();
}

function drawGameOver(){
  ctx.save(); ctx.textAlign='center';
  ctx.shadowColor='#f44'; ctx.shadowBlur=20; ctx.fillStyle='#f44';
  ctx.font=`bold ${Math.min(50,W*.11)}px Courier New`;
  ctx.fillText('GAME OVER',W/2,H/2-60);
  ctx.shadowBlur=0;
  ctx.fillStyle='#0ff'; ctx.font=`bold ${Math.min(18,W*.04)}px Courier New`;
  ctx.fillText('SCORE: '+score,W/2,H/2-10);
  ctx.fillStyle='#ff0'; ctx.font=`${Math.min(14,W*.032)}px Courier New`;
  ctx.fillText('LEVEL REACHED: '+level,W/2,H/2+18);
  ctx.fillText('HI-SCORE: '+Math.max(score,hi),W/2,H/2+42);
  if(Math.floor(Date.now()/600)%2===0){
    ctx.fillStyle='#0f0'; ctx.font=`bold ${Math.min(14,W*.033)}px Courier New`;
    ctx.fillText('ontouchstart' in window?'TAP TO PLAY AGAIN':'CLICK / ENTER',W/2,H/2+86);
  }
  ctx.restore();
}

// ── Go ────────────────────────────────────────────────────────────────────
loop();
</script>
